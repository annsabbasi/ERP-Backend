packages:
  - apps/*
  - packages/*

# Packages allowed to run install scripts (pnpm 10 blocks all others).
onlyBuiltDependencies:
  - esbuild
  - prisma
  - '@prisma/engines'

# Install scripts that are not needed: optional native speed-ups.
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - msgpackr-extract
  - unrs-resolver
