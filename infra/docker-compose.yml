# Local services for development (§10.16, ADR 0007). Start everything with `pnpm local:up`
# (docs/local-dev.md). Host ports can be changed in infra/.env when another program already
# uses one; the .env URLs must then use the same ports.
# Postgres and Redis are pinned to the versions CI uses (.github/workflows/ci.yml).

name: erp

services:
  postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: erp
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U erp -d erp']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6381}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible object storage. The official minio/minio image is no longer
  # published on Docker Hub; Chainguard builds the same MinIO server. Its free images
  # carry only the latest tag, so the digest pins it: MinIO RELEASE.2026-09-22T19-25-18Z.
  minio:
    image: chainguard/minio:latest@sha256:ad134b2dd572ae0d989d6807c3e45516cc75a34883a8021db2ff04be5d1d496a
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: erp-minio
      MINIO_ROOT_PASSWORD: erp-minio-local
      MC_HOST_local: http://localhost:9000
      MC_CONFIG_DIR: /tmp/mc
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # Mail catcher (D4 locally): every mail the system sends, on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  redis-data:
  minio-data:
  mailpit-data:
